name: Build All
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-desktop:
    name: Build & Test Desktop (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build Desktop solution
        run: dotnet build ZeroV.Desktop.slnf --configuration Debug

      - name: Run ZeroV.Game.Tests
        run: dotnet test ZeroV.Desktop.slnf --configuration Debug --no-build --verbosity normal

  build-and-test-ruleset:
    name: Build & Test osu! Ruleset (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build osu! Ruleset solution
        run: dotnet build osu.Game.Rulesets.ZeroV.slnf --configuration Debug

      - name: Run osu.Game.Rulesets.ZeroV.Tests
        run: dotnet test osu.Game.Rulesets.ZeroV.slnf --configuration Debug --no-build --verbosity normal

  build-android:
    name: Build for Android (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Compile Android solution
        run: dotnet build ZeroV.Android.slnf --configuration Debug

  build-ios:
    name: Build for iOS (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Compile iOS solution
        run: dotnet build ZeroV.iOS.slnf --configuration Debug
